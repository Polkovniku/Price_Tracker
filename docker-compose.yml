services:
  db:
    image: postgres:16
    container_name: price_tracker_db
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: booking_redis
    ports:
      - "6379:6379"

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run celery -A app.tasks.celery_tasks.celery_app worker --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run celery -A app.tasks.celery_tasks.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      redis:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8000"
  
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: booking_nginx
    ports:
      - "80:80"
    depends_on:
      - api
  
  
volumes:
  postgres_data:
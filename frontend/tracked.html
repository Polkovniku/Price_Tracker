<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My products — PriceTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a class="logo" href="index.html" data-i18n="app.name">Price Tracker</a>
        <div class="nav-actions">
            <select class="lang-switch" data-lang-switch aria-label="Language switcher">
                <option value="en">English</option>
                <option value="uk">Українська</option>
            </select>
            <ul class="nav-links">
                <li><a href="search.html" data-i18n="nav.addProduct">Add product</a></li>
                <li><a href="tracked.html" class="active" data-i18n="nav.tracked">Tracked items</a></li>
                <li><a href="#" id="logoutBtn" data-i18n="nav.logout">Log out</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 data-i18n="tracked.title">My products</h1>
            <p data-i18n="tracked.subtitle">Products you are tracking</p>
        </div>

        <div id="content">
            <div class="loading" data-i18n="tracked.loading">Loading...</div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();

        const syncTitle = () => {
            document.title = t("tracked.title");
        };

        syncTitle();
        window.addEventListener("languagechange", syncTitle);

        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            logout();
        });

        async function loadProducts() {
            const content = document.getElementById("content");
            try {
                await ensureAuth();
                const products = await getProducts();

                if (!products || products.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 40px">📦</div>
                            <p>${t("tracked.empty")}</p>
                            <a href="search.html" class="btn btn-primary" style="margin-top: 16px">${t("tracked.findButton")}</a>
                        </div>`;
                    return;
                }

                content.innerHTML = `<div class="product-grid">${products.map(p => `
                    <div class="product-card">
                        <img src="${p.image_url || ''}" alt="${p.title}" onerror="this.style.display='none'">
                        <div class="product-info">
                            <div class="product-brand">${p.brand || ''}</div>
                            <div class="product-title">${p.title}</div>
                            <div class="product-price">${Number(p.price).toLocaleString()} ₴</div>
                        </div>
                        <div class="product-actions" style="display: flex; gap: 8px;">
                            <a href="product.html?id=${p.id}" class="btn btn-outline btn-sm" style="flex: 1; text-align: center;">
                                ${t("tracked.details")}
                            </a>
                            <button class="btn btn-danger btn-sm" onclick="removeProduct('${p.id}', this)">
                                ${t("tracked.remove")}
                            </button>
                        </div>
                    </div>
                `).join('')}</div>`;

            } catch (e) {
                content.innerHTML = `<div class="empty-state"><p>${t("product.error")}: ${e.message}</p></div>`;
            }
        }

        async function removeProduct(id, btn) {
            btn.disabled = true;
            try {
                await ensureAuth();
                await deleteProduct(id);
                loadProducts();
            } catch (e) {
                btn.disabled = false;
            }
        }

        loadProducts();

        window.addEventListener("languagechange", () => {
            loadProducts();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої товари — PriceTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a class="logo" href="index.html">Price Tracker</a>
        <ul class="nav-links">
            <li><a href="search.html">Додати товар</a></li>
            <li><a href="tracked.html" class="active">Мої товари</a></li>
            <li><a href="#" id="logoutBtn">Вийти</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Мої товари</h1>
            <p>Товари, які ви відстежуєте</p>
        </div>

        <div id="content">
            <div class="loading">Завантажуємо...</div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();

        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            logout();
        });

        async function loadProducts() {
            const content = document.getElementById("content");
            try {
                await ensureAuth();
                const products = await getProducts();

                if (!products || products.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 40px">📦</div>
                            <p>Ви ще не відстежуєте жодного товару</p>
                            <a href="search.html" class="btn btn-primary" style="margin-top: 16px">Знайти товар</a>
                        </div>`;
                    return;
                }

                content.innerHTML = `<div class="product-grid">${products.map(p => `
                    <div class="product-card">
                        <img src="${p.image_url || ''}" alt="${p.title}" onerror="this.style.display='none'">
                        <div class="product-info">
                            <div class="product-brand">${p.brand || ''}</div>
                            <div class="product-title">${p.title}</div>
                            <div class="product-price">${Number(p.price).toLocaleString()} ₴</div>
                        </div>
                        <div class="product-actions" style="display: flex; gap: 8px;">
                            <a href="product.html?id=${p.id}" class="btn btn-outline btn-sm" style="flex: 1; text-align: center;">
                                Докладніше
                            </a>
                            <button class="btn btn-danger btn-sm" onclick="removeProduct('${p.id}', this)">
                                ✕
                            </button>
                        </div>
                    </div>
                `).join('')}</div>`;

            } catch (e) {
                content.innerHTML = `<div class="empty-state"><p>Помилка завантаження: ${e.message}</p></div>`;
            }
        }

        async function removeProduct(id, btn) {
            btn.disabled = true;
            try {
                await ensureAuth();
                await deleteProduct(id);
                loadProducts();
            } catch (e) {
                btn.disabled = false;
            }
        }

        loadProducts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — PriceTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Price Traccker</h1>
            <p>Створіть обліковий запис</p>

            <div class="form-group">
                <label>Ім'я</label>
                <input type="text" id="name" placeholder="Іван">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@gmail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••">
            </div>

            <p class="error-msg" id="error"></p>

            <button class="btn btn-primary" id="registerBtn">Зареєструватись</button>

            <div class="auth-footer">
                Вже є обліковий запис? <a href="login.html">Увійти</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (isLoggedIn()) window.location.href = "index.html";

        document.getElementById("registerBtn").addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");
            const btn = document.getElementById("registerBtn");

            error.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Створюємо обліковий запис...";

            try {
                await register(name, email, password);
                const data = await login(email, password);
                saveTokens(data.access_token, data.refresh_token);
                window.location.href = "index.html";
            } catch (e) {
                error.textContent = e.message;
                error.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Зареєструватись";
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("registerBtn").click();
        });
    </script>
</body>
</html>

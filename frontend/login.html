<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Увійти — PriceTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Price Tracker</h1>
            <p>Увійдіть до свого облікового запису</p>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••">
            </div>

            <p class="error-msg" id="error"></p>

            <button class="btn btn-primary" id="loginBtn">Увійти</button>

            <div class="auth-footer">
                Немає облікового запису? <a href="register.html">Зареєструватись</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (isLoggedIn()) window.location.href = "index.html";

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");
            const btn = document.getElementById("loginBtn");

            error.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Входимо...";

            try {
                const data = await login(email, password);
                saveTokens(data.access_token, data.refresh_token);
                window.location.href = "index.html";
            } catch (e) {
                error.textContent = e.message;
                error.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Увійти";
            }
        });

        // Enter для сабмита
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("loginBtn").click();
        });
    </script>
</body>
</html>

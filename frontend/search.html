<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додати товар — PriceTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a class="logo" href="index.html">Price Tracker</a>
        <ul class="nav-links">
            <li><a href="search.html" class="active">Додати товар</a></li>
            <li><a href="tracked.html">Мої товари</a></li>
            <li><a href="#" id="logoutBtn">Вийти</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Додати товар</h1>
            <p>Знайдіть товар за назвою або вставте посилання з Розетки</p>
        </div>

        <div class="tabs">
            <button class="tab active" id="tabSearch">Пошук за назвою</button>
            <button class="tab" id="tabLink">За посиланням</button>
        </div>

        
        <div id="panelSearch">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Наприклад: Playstation">
                <button class="btn btn-primary" id="searchBtn">Знайти</button>
            </div>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 6px;">
                Якщо товар не знайдено, додайте його за прямим посиланням з Rozetka
            </p>
            <p class="error-msg" id="searchError"></p>
            <div id="searchResults"></div>
        </div>

        
        <div id="panelLink" style="display: none;">
            <div class="search-bar">
                <input type="text" id="linkInput" placeholder="https://rozetka.com.ua/ua/.../p123456/">
                <button class="btn btn-primary" id="addByLinkBtn">Додати</button>
            </div>
            <p class="error-msg" id="linkError"></p>
            <p id="linkSuccess" style="display:none; color: var(--primary); font-size: 14px; margin-top: 8px;"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();

        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            logout();
        });

        const tabSearch = document.getElementById("tabSearch");
        const tabLink = document.getElementById("tabLink");
        const panelSearch = document.getElementById("panelSearch");
        const panelLink = document.getElementById("panelLink");

        tabSearch.addEventListener("click", () => {
            tabSearch.classList.add("active");
            tabLink.classList.remove("active");
            panelSearch.style.display = "block";
            panelLink.style.display = "none";
        });

        tabLink.addEventListener("click", () => {
            tabLink.classList.add("active");
            tabSearch.classList.remove("active");
            panelLink.style.display = "block";
            panelSearch.style.display = "none";
        });

        document.getElementById("searchBtn").addEventListener("click", async () => {
            const text = document.getElementById("searchInput").value.trim();
            const error = document.getElementById("searchError");
            const results = document.getElementById("searchResults");
            const btn = document.getElementById("searchBtn");

            if (!text) return;

            error.style.display = "none";
            results.innerHTML = '<div class="loading">Шукаємо товари...</div>';
            btn.disabled = true;

            try {
                await ensureAuth();
                const data = await searchProducts(text);
                renderSearchResults(data, results);
            } catch (e) {
                error.textContent = e.message;
                error.style.display = "block";
                results.innerHTML = "";
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById("searchInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("searchBtn").click();
        });

        function renderSearchResults(products, container) {
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Нічого не знайдено</p></div>';
                return;
            }

            container.innerHTML = `<div class="product-grid">${products.map(p => `
                <div class="product-card">
                    <img src="${p.images?.main || ''}" alt="${p.title}" onerror="this.style.display='none'">
                    <div class="product-info">
                        <div class="product-brand">${p.brand || ''}</div>
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price?.toLocaleString()} ₴</div>
                    </div>
                    <div class="product-actions">
                        <button class="btn btn-primary btn-sm" style="width:100%" onclick="addByHref('${p.href}', this)">
                            Слідкувати
                        </button>
                    </div>
                </div>
            `).join('')}</div>`;
        }

        async function addByHref(href, btn) {
            btn.disabled = true;
            btn.textContent = "Додаємо...";
            try {
                await ensureAuth();
                await addProduct(href);
                btn.textContent = "✓ Додано";
                btn.style.background = "#6b7280";
            } catch (e) {
                btn.textContent = e.message === "Product already tracked" ? "Вже відстежується" : "Помилка";
                btn.disabled = false;
            }
        }

        document.getElementById("addByLinkBtn").addEventListener("click", async () => {
            const href = document.getElementById("linkInput").value.trim();
            const error = document.getElementById("linkError");
            const success = document.getElementById("linkSuccess");
            const btn = document.getElementById("addByLinkBtn");

            error.style.display = "none";
            success.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Додаємо...";

            try {
                await ensureAuth();
                await addProduct(href);
                success.textContent = "✓ Товар доданий до відстежуваних";
                success.style.display = "block";
                document.getElementById("linkInput").value = "";
            } catch (e) {
                error.textContent = e.message;
                error.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Додати";
            }
        });
    </script>
</body>
</html>
